name: Web Test

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-test.yml"

permissions: {}

concurrency:
  group: web-test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  web-test:
    name: Web Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # 11.12.0 の self-installer がクラッシュするため、動作確認済みの
          # バージョンに固定する (https://github.com/pnpm/action-setup の
          # "Switching pnpm" 時に "Cannot use 'in' operator" で落ちる)
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Type check
        run: pnpm -C web exec tsc --noEmit

      - name: Run tests
        run: pnpm -C web test
