---
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      go-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      go-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    versioning-strategy: "increase-if-necessary"
    cooldown:
      default-days: 3
    groups:
      npm-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
